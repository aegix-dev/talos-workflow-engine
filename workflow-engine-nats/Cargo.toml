[package]
name = "workflow-engine-nats"
version = "0.1.0"
edition = "2021"
description = "NATS-backed NodeDispatcher + JobTransport for the workflow-engine crate. Implements the signed-NATS job protocol used by the Talos controller and worker."
license = "MIT OR Apache-2.0"

[dependencies]
workflow-engine-core = { path = "../workflow-engine-core" }
workflow-engine = { path = "../workflow-engine" }
# Match the controller's async-nats version (0.37). Bumping here
# without bumping the controller would produce two incompatible
# `async_nats::Client` types in the same build.
async-nats = "0.37"
async-trait = "0.1"
job-protocol = { path = "../../job-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"
# `missing_docs` deliberately not set during the initial port — the
# moved code inherits the workflow-engine crate's doc density; a
# follow-up pass can enable it once the crate has stabilised.
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
# Pragmatic for a port: the moved body inherited patterns from
# pre-extraction that are fine in context. Silencing these as a bundle
# is cleaner than per-site `#[allow]`s during the move.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
match_wildcard_for_single_variants = "allow"
implicit_hasher = "allow"
doc_markdown = "allow"
redundant_closure_for_method_calls = "allow"
uninlined_format_args = "allow"
map_unwrap_or = "allow"
single_match_else = "allow"
option_if_let_else = "allow"
single_match = "allow"
ref_option = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
default_trait_access = "allow"
implicit_clone = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
if_not_else = "allow"
redundant_else = "allow"
wildcard_imports = "allow"
semicolon_if_nothing_returned = "allow"
manual_string_new = "allow"
unnecessary_wraps = "allow"
trivially_copy_pass_by_ref = "allow"
unused_self = "allow"
unused_async = "allow"
