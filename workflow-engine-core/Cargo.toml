[package]
name = "workflow-engine-core"
version = "0.1.0"
edition = "2021"
description = "Core data model and traits for a portable workflow execution engine (DAG, edges, retry/join/system-node taxonomy)."
license = "MIT OR Apache-2.0"
# repository/keywords/categories intentionally omitted until first publish;
# populating placeholder values here would bake stale metadata into crates.io.

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pragmatic carve-outs for a data-model crate: these fire on patterns
# that are fine in application code and would be noise to silence per-site.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
